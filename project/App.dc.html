<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* the whole flow on one board: one shared memory (gnCourse.fresh()), one screen at a time; every screen gets the same
   props (go, app, save, miss, reviewed, level), as Yaoki's prototype does. The screens that are only moments on the
   canvas (the moment boards, the build showcase, the spelling pad on its own, the brand boards) are not played here. */
const SCREENS = ['Goal', 'Placement', 'Main', 'Today', 'Levels', 'Progress', 'Teach', 'Compare', 'Drill', 'Exam', 'Words', 'Reading', 'Listening', 'WeekTest', 'Notebook', 'Review', 'ExamTab', 'LevelExam', 'Leer', 'Escribir', 'Hablar'];
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = window.gnCourse.fresh();
this.h = window.gnCourse.handlers(() => this.state, (fn) => this.setState(fn));
}
renderVals() {
const s = this.state;
const at = {};
SCREENS.forEach((n) => { at[n] = s.screen === n; });
return {
at,
app: window.gnCourse.view(s),
go: this.h.go,
save: this.h.save,
miss: this.h.miss,
reviewed: this.h.reviewed,
level: this.h.level,
};
}
}
</script>
