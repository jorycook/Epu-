class Component extends DCLogic {
  renderVals() {
    const C = window.gnCourse;
    /* A1 has eight units: eight petals */
    const UNITS = 8;
    /* the brief's recipe; each card's aria-label states its ritual state in the markup */
    const ro = (done, goal, passed) => {
      const r = C && C.rosette ? C.rosette(UNITS, done, { hub: goal, rim: passed }) : null;
      return {
        on: r ? r.on : 'M0 0',
        off: r ? r.off : 'M0 0',
        spokes: r ? r.spokes : 'M0 0',
        rimD: r ? r.rimD : 'M0 0',
        frameOpacity: passed ? 0 : 1,
        rimOpacity: passed ? 1 : 0,
        hubFill: goal ? '#C2336F' : '#FFFFFF'
      };
    };
    return {
      frame: ro(0, false, false),
      hub: ro(0, true, false),
      mid: ro(3, true, false),
      whole: ro(UNITS, true, true)
    };
  }
}
