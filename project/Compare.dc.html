<script type="text/x-dc" data-dc-script data-props='{"go":{"editor":null},"app":{"editor":null},"save":{"editor":null},"miss":{"editor":null},"reviewed":{"editor":null},"level":{"editor":null},"$preview":{"width":390,"height":844}}'>
/* Compare: the last "learn" page. The day's forms side by side with a look-alike, each with a two-word tag for what
   sets it apart, then one quick check that records nothing and can be answered again. On the review day it is the
   only learn page. Everything comes through window.gnCourse, guarded: a day not written yet says "En preparación". */
const SID = 'a1u01d2';
const TAGS = { down: '#FDEBE6', up: '#FFF4D6', dot: '#E8ECFB' };
const list = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);
const text = (v) => (typeof v === 'string' ? v : '');
/* the designed moment's learner (BOARDS.md SAMPLE, built relative to today so it never drifts), back on day 2
   ("Pronombres: ñande y ore") from the week path */
function sample() {
  const C = window.gnCourse;
  const T = C.today(C.now());
  const full = { g: 3, k: 1, r: 1 };
  return { level: 'A1', started: true, plan: { start: C.addDays(T, -3), target: C.addDays(T, 60), pace: 'fit', minutes: 30 },
    done: { a1u01d1: full, a1u01d2: full, a1u01d3: full, a1u01d4: { g: 1 } }, tests: {}, exams: {}, mistakes: [],
    cur: SID, tp: 0, set: 'day', placement: { comp: 'A2', prod: 'A1', start: 'A1' }, typed: [] };
}
/* Guarani text as segments: glosses over words, the taught form highlighted, the blank of a question as one box.
   A highlight inside a word (Mba'éicha{pa}) drops its padding on the side that touches a letter, so the word stays whole.
   Each segment keeps the line breaks of a dialogue (pre-line: a span's own white-space wins over its container's);
   only a short highlight is kept on one line. */
function segs(C, src, opt) {
  const out = C.rich(text(src), opt);
  return out.map((g, i) => {
    const on = g.bg !== 'transparent';
    const prev = out[i - 1];
    const next = out[i + 1];
    const left = on && !!prev && /\S$/.test(prev.t || '') && /^\S/.test(g.t || '');
    const right = on && !!next && /^\S/.test(next.t || '') && /\S$/.test(g.t || '');
    const short = on && !/\n/.test(g.t || '') && C.chars(g.t || '').length <= 14;
    return {
      t: g.t, r: g.r, ruby: g.ruby, plain: g.plain, blank: !!g.blank, bg: g.bg, ws: short ? 'nowrap' : 'pre-line', line: g.line,
      pad: on ? '0 ' + (right ? '0' : '2px') + ' 0 ' + (left ? '0' : '2px') : '0',
    };
  });
}
class Component extends DCLogic {
constructor(props) {
super(props);
/* pick: the option tapped (0-based) in the check named by "for"; the check is not locked, any option can be tried */
this.state = { pick: null, for: null };
}
/* inside the app, the shared view; on its own the artboard shows the designed moment: week 1, day 2 (ñande and ore),
   the quick check not answered yet */
app() {
if (this.props.app) return this.props.app;
if (!this.sampleApp && window.gnCourse) this.sampleApp = window.gnCourse.view(sample());
return this.sampleApp || {};
}
renderVals() {
const C = window.gnCourse;
const s = this.state;
const nav = (to) => (e) => { const go = this.props.go; if (go) { e.preventDefault(); go(to); } };
const app = this.app();
const sid = app.sid || '';
const where = app.session || C.parse(sid) || {};
const day = app.day || null;
const grammar = (day && day.grammar) || null;
const cmp = (grammar && grammar.compare) || {};
const points = list(grammar && grammar.points).filter((p) => typeof p === 'object');
const forms = list(cmp.forms).filter((f) => typeof f === 'object').map((f) => ({
form: C.plain(text(f.form)),
tag: C.plain(text(f.tag)),
hasTag: !!text(f.tag),
tagBg: TAGS[f.mark] || '#E8ECFB',
down: f.mark === 'down',
up: f.mark === 'up',
dot: f.mark !== 'down' && f.mark !== 'up',
segs: segs(C, f.gn),
hasGn: !!text(f.gn),
es: text(f.es),
hasEs: !!text(f.es),
}));
const it = cmp.check && typeof cmp.check === 'object' && Array.isArray(cmp.check.options) && cmp.check.options.length ? cmp.check : null;
const options = it ? it.options.map((o) => C.plain(text(o))) : [];
const key = it ? it.id || sid + '.c' : '';
const pick = s.for === key ? s.pick : null;
const answered = pick !== null && pick >= 0 && pick < options.length;
const right = answered && pick + 1 === it.answer;
const opts = options.map((label, i) => {
let look = { border: '2px solid #1B2440', bg: '#FFFFFF', shadow: '0 3px 0 #1B2440', color: '#1B2440' };
if (answered) {
if (i + 1 === it.answer) look = { border: '2.5px solid #0B7A6B', bg: '#E0F3EF', shadow: 'none', color: '#1B2440' };
else if (i === pick) look = { border: '2.5px solid #C7361E', bg: '#FDEBE6', shadow: 'none', color: '#1B2440' };
else look = { border: '2px solid #DDE1EC', bg: '#FFFFFF', shadow: 'none', color: '#5A6382' };
}
const isRight = answered && i + 1 === it.answer;
const isBad = answered && i === pick && !isRight;
return Object.assign({
label,
on: pick === i,
right: isRight,
bad: isBad,
aria: label + (isRight ? ', respuesta correcta' : isBad ? ', tu respuesta, incorrecta' : ''),
pick: () => this.setState({ pick: i, for: key }),
}, look);
});
const why = answered ? text(Array.isArray(it.why) ? it.why[pick] : '') || text(it.explain) : '';
/* the options share one row while every one is short (ten letters at most, about thirty for the whole row);
   a longer option gets a row of its own */
const longest = options.reduce((m, o) => Math.max(m, C.chars(o).length), 0);
const short = options.length > 0 && longest <= 10 && longest * options.length <= 30;
const has = forms.length > 0 || !!it;
const pages = has ? points.length + 1 : 3;
const title = text(day && day.title) || text(where.title);
const dayKicker = where.unit ? ('Semana ' + where.unit + (where.day && where.day !== 't' ? ' · Día ' + where.day : '')).toUpperCase() : '';
return {
has,
none: !has,
dots: Array.from({ length: pages }, () => ({ bg: has ? '#2F4FD0' : '#DDE1EC' })),
pageLabel: has ? 'Página ' + pages + ' de ' + pages : 'Lección en preparación',
intro: C.plain(text(cmp.intro)),
hasIntro: has && !!text(cmp.intro),
forms,
hasCheck: !!it,
checkLabel: it && text(it.label) ? ' · ' + C.plain(text(it.label)) : '',
/* the clue (the words that decide the answer) is plain while asking and underlined once an option is picked,
   so the reason can point back at it */
q: segs(C, it ? it.q : '', { clue: answered ? 'line' : null }),
cols: 'repeat(' + (short ? options.length : 1) + ', minmax(0, 1fr))',
opts,
asking: !answered,
answered,
right,
wrong: answered && !right,
why,
hasWhy: !!why,
dayKicker,
hasDayKicker: !!dayKicker,
noneText: title ? '«' + title + '»: todavía estamos escribiendo esta lección.' : 'Todavía estamos escribiendo esta lección.',
toToday: nav('Today'),
toDrill: (e) => {
if (this.props.save) this.props.save({ prog: { g: 1 } });
nav('Drill')(e);
},
};
}
}
