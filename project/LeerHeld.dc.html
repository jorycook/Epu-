<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F5F9; color: #1B2440; font-family: 'Nunito', 'Avenir Next', sans-serif">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
/* the reader at the moment a finger holds a phrase that has a grammar pattern; the grey disc marks the finger.
   The phrase is picked from the text itself (window.__gnExtra.reader.works[0]): one whose lens fits between the header
   and the finger first, then a grammar pattern, the most parts, a note, and a place past the first line, so the lens
   floats above the finger, clear of the header, and the looked-up chips stay in view.
   Until the text is written, the reader shows "En preparación". */
class Component extends DCLogic {
constructor(props) {
super(props);
this.demo = this.pick();
}
pick() {
const X = window.__gnExtra;
const w = X && X.reader && Array.isArray(X.reader.works) ? X.reader.works[0] : null;
const raw = w && Array.isArray(w.phrases) ? w.phrases : [];
/* the same phrases the reader draws (it skips empty ones), so the index points at the same phrase */
const list = raw.filter((p) => p && typeof p === 'object' && String(p.t == null ? '' : p.t).replace(/\s+/g, ' ').trim());
/* Where each phrase lands in Leer's text box, roughly: about 36 letters to a 42-px line (Andika 18 px in 326 px), a
   phrase never breaks (it moves to the next line whole, with its punctuation and opening mark), and the first line
   starts 198 px down the screen. The lens is about 86 px, plus 40 for the parts, 40 for a grammar pattern and, for a
   note, 18 + 16 a line of about 42 letters; its top should stay below the header row (94 px). */
const LINE = 36;
const len = (s) => Array.from(String(s == null ? '' : s)).length;
let line = 0;
let used = 0;
let glue = false;
let lead = 0;
let best = null;
let top = -1;
list.forEach((p, i) => {
const tail = p.tail === undefined || p.tail === null ? ' ' : String(p.tail);
const cut = /^(\S*)(\s*)([\s\S]*)$/.exec(tail) || ['', tail, '', ''];
const unit = lead + len(String(p.t).replace(/\s+/g, ' ').trim()) + len(cut[1]);
if (used && !glue && used + 1 + unit > LINE) { line += 1; used = 0; }
used += (used && !glue ? 1 : 0) + unit;
const at = line;
if (/\n/.test(cut[2])) { line += 1; used = 0; }
glue = !cut[2];
lead = len(cut[3].replace(/\s+/g, ''));
const words = (Array.isArray(p.words) ? p.words : []).filter((x) => x && typeof x === 'object');
const parts = words.reduce((a, x) => a + (Array.isArray(x.m) ? x.m.length : 0), 0);
const split = words.some((x) => Array.isArray(x.m) && x.m.length > 1);
const gram = Array.isArray(p.g) && !!p.g[0];
const note = typeof p.n === 'string' ? len(p.n.trim()) : 0;
const lens = 86 + (split ? 40 : 0) + (gram ? 40 : 0) + (note ? 18 + Math.max(22, 16 * Math.ceil(note / 42)) : 0);
const fits = 198 + 42 * at - 6 - lens >= 98;
const s = (fits ? 1000 : 0) + (gram ? 100 : 0) + Math.min(parts, 4) * 10 + (note ? 5 : 0) + (at >= 1 ? 30 : 0);
if (s > top) { top = s; best = i; }
});
return best;
}
renderVals() {
return { demo: this.demo };
}
}
</script>
