<script type="text/x-dc" data-dc-script data-props='{}'>
/* The app's root screen, the counterpart of the canvas's prototype board (App.dc.html): one shared memory, one screen at
   a time, and every screen gets the same props (go, app, save, miss, reviewed, level). What differs is where the memory
   comes from: gnApp.start() reads back what was saved on this device (see gn-app.js), and every change is saved again.
   There is no menu: no screen of the app has a menu button. The build checks that the screens and their props here are
   the prototype board's. Two things are the app's own: when another tab of the app saves, this one takes what it saved
   at a quiet moment (gnApp.catchUp); and when the browser keeps nothing, the week path and the goal screen say so. */
/* the screens that say so when nothing can be saved */
const NOTICE = { Goal: 1, Main: 1 };
const SCREENS = ['Goal', 'Placement', 'Main', 'Today', 'Levels', 'Progress', 'Teach', 'Compare', 'Drill', 'Exam', 'Words', 'Reading', 'Listening', 'WeekTest', 'Notebook', 'Review', 'ExamTab', 'LevelExam', 'Leer', 'Escribir', 'Hablar'];
class Component extends DCLogic {
constructor(props) {
super(props);
/* the app's one memory (see gn-course.js): the level, the plan, the progress of every session, the week tests, the level
   exams, the mistakes, the placement and the words typed; gnApp.start() checks what was saved against the course */
this.state = Object.assign(window.gnApp.start(), { noticeClosed: false });
this.h = window.gnCourse.handlers(() => this.state, (fn) => this.setState(fn));
}
componentDidMount() {
window.gnApp.onScreen(this.state.screen);
this.unwatch = window.gnApp.watch(() => this.catchUp());
/* a unit's sound file arrived (the engine fetches it when the unit is in use): the screen draws its controls again */
this.onSound = () => this.forceUpdate();
document.addEventListener('gnsound', this.onSound);
}
componentWillUnmount() {
if (this.unwatch) this.unwatch();
document.removeEventListener('gnsound', this.onSound);
}
componentDidUpdate() {
const s = this.state;
window.gnApp.remember(s);
window.gnApp.onScreen(s.screen);
this.catchUp();
}
/* what another tab saved, taken on a quiet screen (in a lesson it waits for the way back to the week path) */
catchUp() {
const next = window.gnApp.catchUp(this.state.screen);
if (next) this.setState(next);
}
renderVals() {
const s = this.state;
const at = {};
SCREENS.forEach((n) => { at[n] = s.screen === n; });
return {
at,
notice: !!NOTICE[s.screen] && !s.noticeClosed && window.gnApp.refused(),
closeNotice: () => this.setState({ noticeClosed: true }),
app: window.gnCourse.view(s),
go: this.h.go,
save: this.h.save,
miss: this.h.miss,
reviewed: this.h.reviewed,
level: this.h.level,
};
}
}
</script>
