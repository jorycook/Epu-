<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Marco de la app</title>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes gn-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F5F9; color: #1B2440; font-family: 'Nunito', 'Avenir Next', sans-serif">
<sc-if value="{{ at.Goal }}" hint-placeholder-val="{{ true }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Goal" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Placement }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Placement" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>

<sc-if value="{{ at.Today }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Today" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Levels }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Levels" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>

<sc-if value="{{ at.Teach }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Teach" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Compare }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Compare" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Drill }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Drill" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Exam }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Exam" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Words }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Words" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Reading }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Reading" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Listening }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Listening" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.WeekTest }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="WeekTest" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Notebook }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Notebook" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Review }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Review" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.ExamTab }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="ExamTab" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.LevelExam }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="LevelExam" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Leer }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Leer" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Escribir }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Escribir" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ at.Hablar }}" hint-placeholder-val="{{ false }}"><div style="animation: gn-in 220ms ease-out"><dc-import name="Hablar" go="{{ go }}" app="{{ app }}" save="{{ save }}" miss="{{ miss }}" reviewed="{{ reviewed }}" level="{{ level }}" hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ wait.show }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; box-sizing: border-box; padding: 50px 28px 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; animation: gn-in 220ms ease-out">
<h1 style="margin: 0; font-size: 20px; font-weight: 800; line-height: 1.25">{{ wait.title }}</h1>
<div style="font-size: 13px; font-weight: 500; color: #5A6382; line-height: 1.45; text-wrap: balance">{{ wait.text }}</div>
<sc-if value="{{ wait.failed }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ wait.again }}" style="margin-top: 8px; align-self: stretch; height: 54px; border-radius: 16px; background: #2F4FD0; border: 2px solid #1B2440; box-shadow: 0 4px 0 #1B2440; color: #FFFFFF; font-size: 17px; font-weight: 800"><span lang="gn">Eha'ã jey</span> · Intentá de nuevo</button>
<button onClick="{{ wait.back }}" style="align-self: stretch; height: 44px; border: 0; background: none; color: #2F4FD0; font-size: 15px; font-weight: 800"><span lang="gn">Tapykue</span> · Volver</button>
</sc-if>
</div>
</sc-if>
<sc-if value="{{ note.show }}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 12px; right: 12px; bottom: 100px; z-index: 30; box-sizing: border-box; padding: 8px 4px 8px 14px; border-radius: 16px; background: #FFF4D6; border: 2px solid #1B2440; box-shadow: 0 3px 0 #1B2440; display: flex; align-items: center; gap: 6px; animation: gn-in 220ms ease-out">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 800; line-height: 1.3">{{ note.title }}</div>
<div style="font-size: 12px; font-weight: 500; line-height: 1.4">{{ note.text }}</div>
</div>
<sc-if value="{{ note.hasAction }}" hint-placeholder-val="{{ false }}"><button onClick="{{ note.act }}" style="flex-shrink: 0; height: 44px; padding: 0 12px; border-radius: 12px; background: #FFFFFF; border: 2px solid #1B2440; box-shadow: 0 3px 0 #1B2440; color: #1B2440; font-size: 13px; font-weight: 800; white-space: nowrap">{{ note.action }}</button></sc-if>
<button aria-label="Cerrar el aviso" onClick="{{ note.close }}" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; padding: 0; background: none; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{}'>
/* The app's root screen, the counterpart of the canvas's prototype board (App.dc.html): one shared memory, one screen at
   a time, and every screen gets the same props (go, app, save, miss, reviewed, level). What differs is where the memory
   comes from: gnApp.start() reads back what was saved on this device (see gn-app.js), and every change is saved again.
   There is no menu: no screen of the app has a menu button. The build checks that the screens and their props here are
   the prototype board's. The rest is the app's own:
   - when another tab of the app saves, this one takes what it saved at a quiet moment (gnApp.catchUp);
   - a screen of the later file that is not in yet (see gn-app.js, "the screens that come later") gets a waiting note
     in its place, and a way to try again when the file could not be fetched;
   - the system's back goes through gnApp, which is told the screen on show and handed go();
   - one notice at a time above the tab bar, on the goal screen and the week path: the browser keeps nothing; what is
     saved belongs to a newer build of the app; a progress code has just replaced the progress (with a way back); and,
     on the week path in Safari on an iPhone, the browser deletes what a page saved when it is not opened for a week
     («Qué hacer» opens the install page again: the steps to the Home Screen and the code that takes the progress there). */
/* the screens that show a notice */
const NOTICE = { Goal: 1, Main: 1 };
const SCREENS = ['Goal', 'Placement', 'Main', 'Today', 'Levels', 'Progress', 'Teach', 'Compare', 'Drill', 'Exam', 'Words', 'Reading', 'Listening', 'WeekTest', 'Notebook', 'Review', 'ExamTab', 'LevelExam', 'Leer', 'Escribir', 'Hablar'];
class Component extends DCLogic {
constructor(props) {
super(props);
/* the app's one memory (see gn-course.js): the level, the plan, the progress of every session, the week tests, the level
   exams, the mistakes, the placement and the words typed; gnApp.start() checks what was saved against the course.
   closed: the notices the learner closed; slow: the screen asked for has been on its way for a moment */
this.state = Object.assign(window.gnApp.start(), { closed: {}, slow: false });
this.h = window.gnCourse.handlers(() => this.state, (fn) => this.setState(fn));
}
componentDidMount() {
this.tell();
this.unwatch = window.gnApp.watch(() => this.catchUp());
/* a unit's sound file arrived (the engine fetches it when the unit is in use), or the later screens did: draw again */
this.redraw = () => this.forceUpdate();
document.addEventListener('gnsound', this.redraw);
document.addEventListener('gnscreens', this.redraw);
window.gnApp.route((to) => this.h.go(to));
this.fetchScreen();
}
componentWillUnmount() {
if (this.unwatch) this.unwatch();
document.removeEventListener('gnsound', this.redraw);
document.removeEventListener('gnscreens', this.redraw);
window.gnApp.route(null);
clearTimeout(this.slowTimer);
}
componentDidUpdate(prevProps, was) {
const s = this.state;
/* a change is saved; a mere redraw (a sound file or the later screens came in) is none, and saves nothing */
if (was !== s) window.gnApp.remember(s);
this.tell();
this.catchUp();
this.fetchScreen();
}
/* the screen on show, for the app around the screens: its name, the screen the app opens on (the week path once there
   is a plan), and whose questions the exam-style screen is asking (a day's, a week test's, a mini exam's) */
tell() {
const s = this.state;
window.gnApp.onScreen(s.screen, { home: s.started && s.plan ? 'Main' : 'Goal', set: s.set });
}
/* what another tab saved, taken on a quiet screen (in a lesson it waits for the way back to the week path) */
catchUp() {
const next = window.gnApp.catchUp(this.state.screen);
if (next) this.setState(next);
}
/* a screen that is not in yet: ask for the later file if nobody has, and say so if it takes more than a moment */
fetchScreen() {
const missing = !window.YK.has(this.state.screen);
if (missing && window.gnApp.screens() === 'no') window.gnApp.getScreens();
if (missing && !this.state.slow && !this.slowTimer) this.slowTimer = setTimeout(() => { this.slowTimer = null; if (!window.YK.has(this.state.screen)) this.setState({ slow: true }); }, 400);
if (!missing && this.slowTimer) { clearTimeout(this.slowTimer); this.slowTimer = null; }
if (!missing && this.state.slow) this.setState({ slow: false });
}
renderVals() {
const s = this.state;
const kit = window.gnApp;
const here = window.YK.has(s.screen);
const at = {};
SCREENS.forEach((n) => { at[n] = here && s.screen === n; });
const failed = !here && kit.screens() === 'failed';
const closed = s.closed || {};
const close = (key, then) => () => { if (then) then(); this.setState((st) => ({ closed: Object.assign({}, st.closed, { [key]: true }) })); };
const quiet = here && !!NOTICE[s.screen];
let note = { show: false };
if (quiet && !closed.refused && kit.refused()) note = { show: true, title: 'No se puede guardar tu progreso', text: 'Este navegador no deja guardar nada: lo que hagas se pierde al cerrar la app.', close: close('refused') };
else if (quiet && !closed.later && kit.later()) note = { show: true, title: 'Hay una versión más nueva de la app', text: 'Tu progreso lo guardó esa versión. Cerrá la app y abrila de nuevo: lo que hagas ahora no se guarda.', close: close('later') };
else if (quiet && kit.pasted()) note = { show: true, title: 'Progreso reemplazado', text: 'Si no era el que querías, todavía podés volver al de antes.', hasAction: true, action: 'Deshacer', act: () => kit.undoPaste(), close: close('pasted', () => kit.keepPaste()) };
else if (here && s.screen === 'Main' && !closed.week && kit.clearsSoon()) note = { show: true, title: kit.browser + ' puede borrar tu progreso', text: 'Lo hace si pasás una semana sin abrir la página.', hasAction: true, action: 'Qué hacer', act: () => kit.showInstall(), close: close('week', () => kit.told()) };
return {
at,
note,
wait: {
show: !here && (failed || !!s.slow),
failed,
title: failed ? 'No llegó esta parte de la app' : 'Cargando…',
text: failed ? 'Falta bajar el resto de la app. Revisá tu conexión y probá de nuevo.' : 'Está llegando el resto de la app. Un momento.',
again: () => kit.getScreens(),
back: () => this.h.go(s.started && s.plan ? 'Main' : 'Goal'),
},
app: window.gnCourse.view(s),
go: this.h.go,
save: this.h.save,
miss: this.h.miss,
reviewed: this.h.reviewed,
level: this.h.level,
};
}
}
</script>
</body>
</html>
